spring:
  application:
    name: par-index-system

  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:par_system}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:paruser}
    password: ${DB_PASS:parpass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 160MB

server:
  port: 8081

  tomcat:
    max-swallow-size: -1
    connection-timeout: 60000

  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  storage:
    base-dir: ./uploads
    clinical-dir: clinical
    training-dir: training

  ml:
    # Base URL of the landmark-prediction microservice (see /ml-service).
    # Disabled by default so a missing/unstarted ML service never blocks
    # the core clinical workflow — only /predict-landmarks needs it.
    service-url: ${ML_SERVICE_URL:http://localhost:5001}
    enabled: ${ML_SERVICE_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.parsystem: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN