services:

  mysql:
    image: mysql:8.0
    container_name: par-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: par_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  par-ml:
    build: ./ml_engine
    container_name: par-ml
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: par_system
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ml_models:/app/models
      - ml_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  par-backend:
    build: ./backend
    container_name: par-backend
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/par_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      ML_SERVICE_URL: http://par-ml:8000
      # REMOVED: STORAGE_BASE_DIR / CLINICAL_DIR / TRAINING_DIR.
      # application.yml hardcodes app.storage.base-dir=./uploads,
      # clinical-dir=clinical, training-dir=training, which StorageService
      # resolves as SUBDIRECTORIES of base-dir. These env vars were never
      # actually read, and if they ever get wired in as absolute paths
      # (as they were set here) they silently reproduce the exact
      # storage_path corruption bug described in StorageService's
      # constructor comment. Removed rather than left as a loaded gun.
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  par-frontend:
    image: node:20-alpine
    container_name: par-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8081
    depends_on:
      - par-backend

volumes:
  mysql_data:
  ml_models:
  ml_data:
  backend_uploads: